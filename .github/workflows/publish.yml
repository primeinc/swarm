name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages (unscoped)
        run: bun turbo build

      - name: Scope packages for @${{ github.repository_owner }}
        run: bun scripts/scope-packages.ts ${{ github.repository_owner }}

      - name: Publish to NPM
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail

          # Publish ALL 6 packages in dependency order:
          # 1. swarm-path (no deps)
          # 2. swarm-mail (depends on swarm-path)
          # 3. swarm (depends on swarm-path & swarm-mail)
          # 4. swarm-evals (depends on swarm & swarm-mail)
          # 5. swarm-claude-code (no workspace deps)
          # 6. swarm-dashboard (depends on swarm-mail)
          PACKAGES=(
            packages/swarm-path
            packages/swarm-mail
            packages/swarm
            packages/swarm-evals
            packages/swarm-claude-code
            packages/swarm-dashboard
          )

          for pkg in "${PACKAGES[@]}"; do
            echo "📦 Publishing $pkg..."
            # bun publish resolves workspace:* to actual versions automatically
            # --access public required for scoped packages
            (cd "$pkg" && bun publish --access public) || echo "⚠️ May already exist"
          done
        env:
          # bun publish uses NPM_CONFIG_TOKEN (not NODE_AUTH_TOKEN)
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run - show what would be published
        if: ${{ inputs.dry_run == true }}
        run: |
          PACKAGES=(
            packages/swarm-path
            packages/swarm-mail
            packages/swarm
            packages/swarm-evals
            packages/swarm-claude-code
            packages/swarm-dashboard
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "📦 Would publish $pkg:"
            cat "$pkg/package.json" | jq '{name, version, dependencies}'
          done
