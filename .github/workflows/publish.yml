name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write # For npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags need history

      - uses: oven-sh/setup-bun@v2

      - name: Setup npmrc for publishing
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
          echo "always-auth=true" >> .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scope packages for repository owner
        run: bun scripts/scope-packages.ts ${{ github.repository_owner }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          # Turbo filters need the ACTUAL package names after scoping
          bun turbo build --filter="@${OWNER}/swarm" --filter="@${OWNER}/swarm-mail"

      - name: Verify build artifacts
        uses: ./.github/actions/verify-build
        with:
          owner: ${{ github.repository_owner }}

      - name: Publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          # In this workflow, we ONLY publish.
          publish: ${{ inputs.dry_run == true && 'echo Skipping publish (dry run)' || 'bun run ci:publish' }}
          createGithubReleases: true
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Get release info
        if: steps.changesets.outputs.published == 'true'
        id: release_info
        run: |
          # Get changelog
          CHANGELOG=$(head -80 packages/opencode-swarm-plugin/CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Get the PR that was merged to trigger this release
          RELEASE_PR=$(gh pr list --state merged --limit 1 --json url --jq '.[0].url')
          echo "release_url=$RELEASE_PR" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release tweet
        if: steps.changesets.outputs.published == 'true'
        id: tweet
        continue-on-error: true
        uses: vercel/ai-action@v2
        with:
          model: "anthropic/claude-opus-4-5"
          api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          prompt: |
            Write a tweet announcing this release. Rules:
            - Max 280 chars
            - Only emoji allowed: 🐝 (use once, at start)
            - No hashtags
            - Include version number
            - Terse, technical, slightly cheeky tone
            
            Now write ONE tweet for this changelog. Output ONLY the tweet, nothing else.
            IMPORTANT: End the tweet with a space and this exact link: ${{ steps.release_info.outputs.release_url }}
            
            ${{ steps.release_info.outputs.changelog }}

      - name: Post to X (API v2)
        if: steps.changesets.outputs.published == 'true' && steps.tweet.outputs.text != ''
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "📋 TWEET TEXT:"
          echo "$TWEET_TEXT"
          echo "═══════════════════════════════════════════════════════════════"
          
          pip install requests requests-oauthlib -q
          python3 << 'PYEOF'
          import os
          import time
          from requests_oauthlib import OAuth1Session
          
          tweet_text = os.environ['TWEET_TEXT']
          client = OAuth1Session(
              os.environ['X_API_KEY'],
              client_secret=os.environ['X_API_SECRET'],
              resource_owner_key=os.environ['X_ACCESS_TOKEN'],
              resource_owner_secret=os.environ['X_ACCESS_TOKEN_SECRET'],
          )
          
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "SwarmToolsBot/1.0",
          }
          
          response = client.post(
              "https://api.twitter.com/2/tweets",
              json={"text": tweet_text},
              headers=headers,
          )
          
          if response.status_code == 201:
              print(f"✅ Tweet posted!")
          else:
              print(f"❌ Failed: {response.status_code} {response.text}")
              exit(1)
          PYEOF
        env:
          TWEET_TEXT: ${{ steps.tweet.outputs.text }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
