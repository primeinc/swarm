name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scope packages for @${{ github.repository_owner }}
        run: bun scripts/scope-packages.ts ${{ github.repository_owner }}

      - name: Build only publishable packages
        run: |
          # Build swarm-mail first (dependency)
          (cd packages/swarm-mail && bun run build)
          # Build opencode-swarm-plugin
          (cd packages/opencode-swarm-plugin && bun run build)

      - name: Publish to NPM
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          
          for pkg in packages/swarm-mail packages/opencode-swarm-plugin; do
            echo "📦 Publishing $pkg..."
            # Always publish as beta - this is a fork, not the canonical release
            (cd "$pkg" && npm publish --access public --tag beta) || echo "⚠️ May already exist"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Fix dist-tags (remove latest, keep only beta)
        if: ${{ inputs.dry_run != true }}
        run: |
          OWNER="${{ github.repository_owner }}"
          for pkg in "@${OWNER}/swarm" "@${OWNER}/swarm-mail"; do
            echo "🏷️ Fixing dist-tags for $pkg..."
            # Remove 'latest' tag if it exists (fork shouldn't have latest)
            npm dist-tag rm "$pkg" latest 2>/dev/null || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run - show what would be published
        if: ${{ inputs.dry_run == true }}
        run: |
          for pkg in packages/swarm-mail packages/opencode-swarm-plugin; do
            echo "📦 Would publish $pkg:"
            cat "$pkg/package.json" | jq '{name, version}'
          done
