name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scope packages for @${{ github.repository_owner }}
        run: bun scripts/scope-packages.ts ${{ github.repository_owner }}

      - name: Refresh workspace after scoping
        run: |
          # Delete old lockfile - it references pre-scoped package names
          # (e.g., "opencode-swarm-plugin" instead of "@primeinc/swarm")
          rm bun.lock
          # Regenerate lockfile with the new scoped package names
          bun install

      - name: Build only publishable packages
        run: |
          # Build cross-path first (no workspace dependencies)
          (cd packages/cross-path && bun run build)
          # Build swarm-mail (depends on cross-path)
          (cd packages/swarm-mail && bun run build)
          # Build opencode-swarm-plugin (depends on both)
          (cd packages/opencode-swarm-plugin && bun run build)

      - name: Publish to NPM
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail

          # Publish in dependency order:
          # 1. cross-path (no deps)
          # 2. swarm-mail (depends on cross-path)
          # 3. swarm (depends on both)
          for pkg in packages/cross-path packages/swarm-mail packages/opencode-swarm-plugin; do
            echo "📦 Publishing $pkg..."
            # bun publish resolves workspace:* to actual versions automatically
            # --access public required for scoped packages
            # --tag beta marks these as beta releases (fork of upstream)
            (cd "$pkg" && bun publish --access public --tag beta) || echo "⚠️ May already exist"
          done
        env:
          # bun publish uses NPM_CONFIG_TOKEN (not NODE_AUTH_TOKEN)
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run - show what would be published
        if: ${{ inputs.dry_run == true }}
        run: |
          for pkg in packages/cross-path packages/swarm-mail packages/opencode-swarm-plugin; do
            echo "📦 Would publish $pkg:"
            cat "$pkg/package.json" | jq '{name, version, dependencies}'
          done
