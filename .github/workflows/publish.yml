name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scope packages for @${{ github.repository_owner }}
        run: bun scripts/scope-packages.ts ${{ github.repository_owner }}

      - name: Build
        run: bun turbo build --filter='!@swarmtools/web' --filter='!swarm-dashboard'

      - name: Publish to NPM
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          
          for pkg in packages/swarm-mail packages/opencode-swarm-plugin; do
            echo "📦 Publishing $pkg..."
            (cd "$pkg" && npm publish --access public) || echo "⚠️ May already exist"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run - show what would be published
        if: ${{ inputs.dry_run == true }}
        run: |
          for pkg in packages/swarm-mail packages/opencode-swarm-plugin; do
            echo "📦 Would publish $pkg:"
            cat "$pkg/package.json" | jq '{name, version}'
          done
