name: Version PR

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scope packages for repository owner
        run: bun scripts/scope-packages.ts ${{ github.repository_owner }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          # Turbo filters need the ACTUAL package names after scoping
          bun turbo build --filter="@${OWNER}/swarm" --filter="@${OWNER}/swarm-mail"

      - name: Verify build artifacts
        uses: ./.github/actions/verify-build
        with:
          owner: ${{ github.repository_owner }}

      - name: Read changesets
        id: changesets_content
        run: |
          set -euo pipefail
          CONTENT=""
          for f in .changeset/*.md; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "README.md" ] && continue
            CONTENT="$CONTENT$(cat "$f")"$'\n\n'
          done
          
          if [ -z "$CONTENT" ]; then
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            {
              echo "content<<EOF"
              echo "$CONTENT"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Generate PR title with AI
        if: steps.changesets_content.outputs.has_changesets == 'true'
        id: pr_title
        continue-on-error: true
        uses: vercel/ai-action@v2
        with:
          model: "anthropic/claude-haiku-4-5"
          api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          prompt: |
            Generate a concise PR title (max 60 chars) for this release. Rules:
            - Start with "release: " prefix
            - Then lowercase verb (add, fix, improve, etc)
            - Be specific about what changed
            - No version numbers
            - Output ONLY the title, nothing else
            
            Changesets:
            ${{ steps.changesets_content.outputs.content }}

      - name: Set PR title
        id: final_title
        run: |
          TITLE="${{ steps.pr_title.outputs.text }}"
          if [ -z "$TITLE" ]; then
            TITLE="release: update versions"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run ci:version
          commit: ${{ steps.final_title.outputs.title }}
          title: ${{ steps.final_title.outputs.title }}
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
